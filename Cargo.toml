[package]
name = "agent-coordinator"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
dunce = "1.0.5"
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
