name: Release

on:
  push:
    tags: ['v*']
    branches: ['release/v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Select the release tag
        id: tag
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          printf 'value=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
          - package: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - package: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - package: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
    env:
      RUST_TOOLCHAIN: '1.88.0'
      RUST_TARGET: ${{ matrix.target }}
      PACKAGE: ${{ matrix.package }}
      ARCHIVE_FORMAT: ${{ matrix.archive }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: refs/tags/${{ env.RELEASE_TAG }}
      - name: Install Linux static build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
      - name: Build and test
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --target $env:RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolchain = "+$env:RUST_TOOLCHAIN"
          $metadata = cargo $toolchain metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ($metadata | ConvertFrom-Json).packages[0].version
          if ($env:RELEASE_TAG -cne "v$version") { throw 'The tag must match Cargo.toml.' }

          cargo $toolchain test --release --locked --target $env:RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo $toolchain build --release --locked --target $env:RUST_TARGET
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and smoke-test the download
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { 'agent-coordinator.exe' } else { 'agent-coordinator' }
          $releaseDir = "target/$env:RUST_TARGET/release"
          $pluginDir = 'target/plugin-package/plugins/agent-coordinator'
          Copy-Item -LiteralPath codex-plugin -Destination 'target/plugin-package' -Recurse -Force
          New-Item -ItemType Directory -Force -Path dist, 'target/package-check', "$pluginDir/bin" | Out-Null
          Copy-Item -LiteralPath "$releaseDir/$binary" -Destination "$pluginDir/bin/$binary"
          if ($IsWindows) {
            $mcp = Get-Content -Raw -LiteralPath "$pluginDir/.mcp.json" | ConvertFrom-Json
            $mcp.mcpServers.agent_coordinator.command = './bin/agent-coordinator.exe'
            $mcp | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath "$pluginDir/.mcp.json" -Encoding utf8
          } else {
            chmod +x "$pluginDir/bin/$binary"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $archive = "dist/agent-coordinator-$env:PACKAGE.$env:ARCHIVE_FORMAT"
          if ($IsWindows) {
            tar -a -cf $archive -C target/plugin-package .
          } else {
            tar -czf $archive -C target/plugin-package .
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unpacked = 'target/package-check'
          tar -xf $archive -C $unpacked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $marketplace = Get-Content -Raw -LiteralPath "$unpacked/.agents/plugins/marketplace.json" | ConvertFrom-Json
          $plugin = "$unpacked/$($marketplace.plugins[0].source.path)"
          $manifest = Get-Content -Raw -LiteralPath "$plugin/.codex-plugin/plugin.json" | ConvertFrom-Json
          if ("v$($manifest.version)" -cne $env:RELEASE_TAG) { throw 'The plugin manifest version must match the tag.' }
          if (!(Test-Path -LiteralPath "$plugin/$($manifest.hooks)" -PathType Leaf)) {
            throw 'The archive is missing the plugin hooks.'
          }
          $mcp = Get-Content -Raw -LiteralPath "$plugin/$($manifest.mcpServers)" | ConvertFrom-Json
          $version = & "./$plugin/$($mcp.mcpServers.agent_coordinator.command)" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($version -cne "agent-coordinator $($env:RELEASE_TAG.Substring(1))") {
            throw "Unexpected version in packaged binary: $version"
          }
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}
          path: dist/agent-coordinator-*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/agent-coordinator-windows-x64.zip \
            dist/agent-coordinator-linux-x64.tar.gz \
            dist/agent-coordinator-macos-arm64.tar.gz \
            dist/agent-coordinator-macos-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Agent Coordinator $RELEASE_TAG" \
            --notes '下载适合你电脑的压缩包，解压后按 README 安装 Codex 插件。'
